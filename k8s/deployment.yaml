apiVersion: apps/v1
kind: Deployment

metadata:
  name: cal-ai

spec:
  replicas: 2

  selector:
    matchLabels:
      app: cal-ai

  template:
    metadata:
      labels:
        app: cal-ai

    spec:
      containers:
      - name: cal-ai

        image: bhumidingana/cal-ai:latest

        imagePullPolicy: Always

        ports:
        - containerPort: 3000